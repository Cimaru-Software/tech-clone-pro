      // Plux llama a onAuthorize cuando el pago es procesado.
      // React registra su handler en window.__pluxCallback antes de abrir el modal.
      var onAuthorize = function(response) {
        if (window.__pluxCallback) {
          window.__pluxCallback(response);
        }
      };
    </script>

    <!-- 3. Script de Plux - se carga después de jQuery y var data -->
